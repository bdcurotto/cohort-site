<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business — Cohort</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/advertiser.css?v=9">
</head>
<body>

<header>
  <div class="wrap">
    <a href="admin-review.html" class="wordmark">Coh<span>o</span>rt</a>
    <nav>
      <a href="#" id="sign-out-link">Sign out</a>
    </nav>
  </div>
</header>

<div class="wrap" style="padding-top: 24px; max-width: 820px; margin: 0 auto;">
  <a href="admin-review.html" class="back-link" style="margin: 0 0 20px;">&larr; Back to campaign review</a>

  <div id="content">
    <p style="color: var(--text-secondary); font-size: 14px;">Loading…</p>
  </div>
</div>

<script type="module">
  import { supabase, requireStaffSession, fetchOwnStaff, signOutStaff } from "./js/supabase-client.js";

  document.getElementById("sign-out-link").addEventListener("click", (e) => {
    e.preventDefault();
    signOutStaff();
  });

  const TIER_LABELS = { pin_only: "Map Pin", feed_and_pin: "Feed + Map Pin" };
  const SUBMISSION_STATUS_LABELS = {
    pending_review: "Pending review", approved: "Approved", rejected: "Rejected",
    paid: "Paid", live: "Live", expired: "Expired",
  };
  const PAYMENT_STATUS_LABELS = { pending: "Awaiting payment", paid: "Paid", refunded: "Refunded", canceled: "Canceled" };

  function money(cents) {
    return `$${(cents / 100).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;
  }
  function formatDate(d) {
    return d ? new Date(d).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "—";
  }
  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  const content = document.getElementById("content");

  // Populated once by loadAndRender(), read by render() -- kept outer-scope
  // so clicking a stat tile can re-render with a new filter without a
  // second round trip to Supabase.
  let biz, submissions = [], orders = [], liveCampaigns = [], livePins = [];
  // Which subset the Order history / Submission history tables are
  // currently showing, driven by clicking a stat tile above them. null
  // means "show everything" (the table's original behavior).
  let orderFilter = null; // null | "paid" | "pending"
  let submissionFilter = null; // null | "rejected" | "live"

  const session = await requireStaffSession();
  if (session) {
    const staff = await fetchOwnStaff(session);
    if (!staff) {
      content.innerHTML = `<div class="banner error">This account isn't set up for admin access.</div>`;
    } else {
      await loadAndRender();
    }
  }

  async function loadAndRender() {
    const businessId = new URLSearchParams(window.location.search).get("id");
    if (!businessId) {
      content.innerHTML = `<div class="banner error">No business specified.</div>`;
      return;
    }

    // Four independent queries rather than one big embed -- orders and
    // submissions both need their own sort order and full history (not
    // just what's tied to each other), and the two "currently live" views
    // already encode the exact live-definition logic (is_active AND
    // starts_at <= now AND (ends_at is null or ends_at >= now)) --
    // reusing them here instead of re-deriving that with client-side date
    // math keeps this page's definition of "live" identical to what the
    // app itself actually shows a student.
    const [businessRes, submissionsRes, ordersRes, liveCampaignsRes, livePinsRes] = await Promise.all([
      supabase.from("businesses").select("*").eq("id", businessId).maybeSingle(),
      supabase.from("campaign_submissions").select("*").eq("business_id", businessId).order("created_at", { ascending: false }),
      supabase.from("ad_orders").select("*").eq("business_id", businessId).order("created_at", { ascending: false }),
      supabase.from("active_ad_campaigns").select("*").eq("business_id", businessId),
      supabase.from("active_sponsored_pins").select("*").eq("business_id", businessId),
    ]);

    if (businessRes.error || !businessRes.data) {
      content.innerHTML = `<div class="banner error">Couldn't load this business${businessRes.error ? ": " + businessRes.error.message : ""}.</div>`;
      return;
    }

    biz = businessRes.data;
    submissions = submissionsRes.data || [];
    orders = ordersRes.data || [];
    liveCampaigns = liveCampaignsRes.data || [];
    livePins = livePinsRes.data || [];
    render();
  }

  // Each stat tile maps to a filter + the section it should scroll to --
  // "Total spent" and "Campaigns purchased" both mean "the paid orders",
  // so they share the same filter/target rather than needing separate
  // views. "Currently live" has no table filter of its own (the "Live
  // right now" card above the tables already shows exactly that set) --
  // it just scrolls there.
  const STAT_TARGETS = {
    total_spent: { orderFilter: "paid", scrollTo: "order-history-section" },
    campaigns_purchased: { orderFilter: "paid", scrollTo: "order-history-section" },
    outstanding_balance: { orderFilter: "pending", scrollTo: "order-history-section" },
    currently_live: { scrollTo: "live-now-section" },
    total_submissions: { submissionFilter: null, scrollTo: "submission-history-section" },
    rejected: { submissionFilter: "rejected", scrollTo: "submission-history-section" },
  };

  content.addEventListener("click", (e) => {
    const statBtn = e.target.closest(".biz-stat");
    if (statBtn) {
      const target = STAT_TARGETS[statBtn.dataset.stat];
      if (!target) return;
      if ("orderFilter" in target) orderFilter = target.orderFilter;
      if ("submissionFilter" in target) submissionFilter = target.submissionFilter;
      render();
      document.getElementById(target.scrollTo)?.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    const clearOrders = e.target.closest("[data-clear-order-filter]");
    if (clearOrders) { orderFilter = null; render(); return; }
    const clearSubmissions = e.target.closest("[data-clear-submission-filter]");
    if (clearSubmissions) { submissionFilter = null; render(); return; }
  });

  function render() {
    const paidOrders = orders.filter((o) => o.payment_status === "paid");
    const pendingOrders = orders.filter((o) => o.payment_status === "pending");
    const totalSpentCents = paidOrders.reduce((sum, o) => sum + o.amount_cents, 0);
    const outstandingCents = pendingOrders.reduce((sum, o) => sum + o.amount_cents, 0);
    const liveSubmissionCount = submissions.filter((s) => s.status === "live").length;
    const rejectedCount = submissions.filter((s) => s.status === "rejected").length;

    const shownOrders = orderFilter ? orders.filter((o) => o.payment_status === orderFilter) : orders;
    const shownSubmissions = submissionFilter ? submissions.filter((s) => s.status === submissionFilter) : submissions;
    const orderFilterLabel = orderFilter === "paid" ? "paid" : orderFilter === "pending" ? "awaiting payment" : null;
    const submissionFilterLabel = submissionFilter === "rejected" ? "rejected" : null;

    content.innerHTML = `
      <div class="form-card" style="margin: 0 0 24px;">
        <div style="display:flex; align-items:center; gap:16px; margin-bottom: 6px;">
          ${biz.cover_url
            ? `<img src="${biz.cover_url}" alt="" style="width:56px;height:56px;border-radius:14px;object-fit:cover;flex-shrink:0;">`
            : `<div style="width:56px;height:56px;border-radius:14px;background:var(--bg-alt);flex-shrink:0;"></div>`}
          <div>
            <h1 style="font-size:24px; margin:0;">${escapeHTML(biz.name)}</h1>
            <p class="sub" style="margin:2px 0 0;">${biz.category ? escapeHTML(biz.category) + " · " : ""}Member since ${formatDate(biz.created_at)}</p>
          </div>
        </div>
        <div class="detail-rows" style="margin-top:18px;">
          ${biz.contact_email ? `<div class="detail-row"><span class="detail-label">Contact</span><span>${escapeHTML(biz.contact_email)}</span></div>` : ""}
          ${biz.address ? `<div class="detail-row"><span class="detail-label">Address</span><span>${escapeHTML(biz.address)}</span></div>` : ""}
        </div>
      </div>

      <div class="biz-stat-grid">
        <button type="button" class="biz-stat" data-stat="total_spent"><span class="biz-stat-value">${money(totalSpentCents)}</span><span class="biz-stat-label">Total spent</span></button>
        <button type="button" class="biz-stat" data-stat="campaigns_purchased"><span class="biz-stat-value">${paidOrders.length}</span><span class="biz-stat-label">Campaigns purchased</span></button>
        <button type="button" class="biz-stat${outstandingCents > 0 ? " biz-stat-warn" : ""}" data-stat="outstanding_balance"><span class="biz-stat-value">${money(outstandingCents)}</span><span class="biz-stat-label">Outstanding balance</span></button>
        <button type="button" class="biz-stat" data-stat="currently_live"><span class="biz-stat-value">${liveSubmissionCount}</span><span class="biz-stat-label">Currently live</span></button>
        <button type="button" class="biz-stat" data-stat="total_submissions"><span class="biz-stat-value">${submissions.length}</span><span class="biz-stat-label">Total submissions</span></button>
        <button type="button" class="biz-stat" data-stat="rejected"><span class="biz-stat-value">${rejectedCount}</span><span class="biz-stat-label">Rejected</span></button>
      </div>

      <div class="form-card" id="live-now-section" style="margin: 0 0 24px;">
        <h1 style="font-size:16px;">Live right now</h1>
        ${(liveCampaigns.length === 0 && livePins.length === 0) ? `<p class="sub" style="margin:0;">Nothing live right now.</p>` : `
          <div class="detail-rows">
            ${liveCampaigns.map((c) => `<div class="detail-row"><span class="detail-label">Feed post</span><span>${escapeHTML(c.headline)} — ends ${formatDate(c.ends_at)}</span></div>`).join("")}
            ${livePins.map((p) => `<div class="detail-row"><span class="detail-label">Map pin</span><span>${escapeHTML(p.deal_headline)} — ends ${formatDate(p.ends_at)}</span></div>`).join("")}
          </div>`}
      </div>

      <div class="form-card" id="order-history-section" style="margin: 0 0 24px;">
        <h1 style="font-size:16px; display:flex; align-items:center; gap:8px;">
          Order history
          ${orderFilterLabel ? `<span class="review-copy-link" data-clear-order-filter style="cursor:pointer;">Showing: ${orderFilterLabel} &times;</span>` : ""}
        </h1>
        ${shownOrders.length === 0 ? `<p class="sub" style="margin:0;">${orderFilter ? "No orders match this filter." : "No orders yet."}</p>` : `
          <div class="biz-table">
            <div class="biz-table-head">
              <span>Tier</span><span>Amount</span><span>Status</span><span>Created</span><span>Ends</span>
            </div>
            ${shownOrders.map((o) => `
              <div class="biz-table-row">
                <span>${TIER_LABELS[o.tier] || o.tier}</span>
                <span>${money(o.amount_cents)}</span>
                <span class="status-pill status-${o.payment_status === "paid" ? "approved" : o.payment_status === "pending" ? "pending_review" : "rejected"}">${PAYMENT_STATUS_LABELS[o.payment_status] || o.payment_status}</span>
                <span>${formatDate(o.created_at)}</span>
                <span>${formatDate(o.ends_at)}</span>
              </div>`).join("")}
          </div>`}
      </div>

      <div class="form-card" id="submission-history-section" style="margin: 0 0 60px;">
        <h1 style="font-size:16px; display:flex; align-items:center; gap:8px;">
          Submission history
          ${submissionFilterLabel ? `<span class="review-copy-link" data-clear-submission-filter style="cursor:pointer;">Showing: ${submissionFilterLabel} &times;</span>` : ""}
        </h1>
        ${shownSubmissions.length === 0 ? `<p class="sub" style="margin:0;">${submissionFilter ? "No submissions match this filter." : "No submissions yet."}</p>` : `
          <div class="biz-table">
            <div class="biz-table-head biz-table-4col">
              <span>Headline</span><span>Tier</span><span>Status</span><span>Submitted</span>
            </div>
            ${shownSubmissions.map((s) => `
              <div class="biz-table-row biz-table-4col">
                <span>${escapeHTML(s.headline)}</span>
                <span>${TIER_LABELS[s.tier] || s.tier}</span>
                <span class="status-pill status-${s.status}">${SUBMISSION_STATUS_LABELS[s.status] || s.status}</span>
                <span>${formatDate(s.created_at)}</span>
              </div>`).join("")}
          </div>`}
      </div>`;
  }
</script>

</body>
</html>
