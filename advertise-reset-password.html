<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Cohort Advertising</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/advertiser.css?v=6">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="wordmark">Coh<span>o</span>rt</a>
    <nav>
      <a href="advertise-login.html">Sign in</a>
    </nav>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="sub" id="sub-text">Verifying your reset link…</p>

    <div id="banner"></div>

    <form id="reset-form" style="display:none;">
      <div class="field">
        <label for="new_password">New password</label>
        <div class="password-field">
          <input type="password" id="new_password" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" data-target="new_password"></button>
        </div>
        <p class="hint">At least 8 characters.</p>
      </div>
      <div class="field">
        <label for="confirm_new_password">Confirm new password</label>
        <div class="password-field">
          <input type="password" id="confirm_new_password" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" data-target="confirm_new_password"></button>
        </div>
        <p class="hint" id="confirm-password-hint" style="display:none; color: var(--danger);">Passwords don't match.</p>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn" style="width:100%; margin-top:6px;">Set password</button>
    </form>

    <p class="foot-link" id="request-new-link" style="display:none;">
      <a href="advertise-forgot-password.html">Request a new reset link</a>
    </p>
  </div>
</div>

<script type="module">
  import { supabase, siteURL, setupPasswordToggles } from "./js/supabase-client.js";

  setupPasswordToggles();

  const subText = document.getElementById("sub-text");
  const banner = document.getElementById("banner");
  const form = document.getElementById("reset-form");
  const requestNewLink = document.getElementById("request-new-link");

  function showBanner(message, type) {
    banner.innerHTML = `<div class="banner ${type}">${message}</div>`;
  }

  // In practice, every request always arrives here via auth-redirect.html
  // (see its own doc comment) -- the "Reset Password" email template
  // hardcodes its link to that page, not this one, so this page never
  // actually receives token_hash directly from the email itself.
  // auth-redirect.html verifies the token, detects this is a business
  // account, and forwards here with `?verified=1` once a real session
  // already exists -- token_hash is single-use, so re-verifying it here
  // would just fail with "already consumed." Falling back to a direct
  // token_hash/type=recovery check below too, in case that routing ever
  // changes (e.g. the email template pointing straight here someday) --
  // mirrors the Swift app's `verifyPasswordRecovery`.
  const params = new URLSearchParams(window.location.search);
  const alreadyVerified = params.get("verified") === "1";
  const tokenHash = params.get("token_hash");
  const type = params.get("type");

  if (alreadyVerified) {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      subText.textContent = "Choose a new password for your account.";
      form.style.display = "block";
    } else {
      subText.textContent = "";
      showBanner("This reset link is invalid or has expired.", "error");
      requestNewLink.style.display = "block";
    }
  } else if (!tokenHash || type !== "recovery") {
    subText.textContent = "";
    showBanner("This reset link is missing or malformed.", "error");
    requestNewLink.style.display = "block";
  } else {
    const { error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" });
    if (error) {
      subText.textContent = "";
      showBanner("This link is invalid or has expired.", "error");
      requestNewLink.style.display = "block";
    } else {
      subText.textContent = "Choose a new password for your account.";
      form.style.display = "block";
    }
  }

  const newPasswordInput = document.getElementById("new_password");
  const confirmNewPasswordInput = document.getElementById("confirm_new_password");
  const confirmHint = document.getElementById("confirm-password-hint");
  const submitBtn = document.getElementById("submit-btn");

  function checkPasswordsMatch() {
    const mismatch = confirmNewPasswordInput.value.length > 0 && newPasswordInput.value !== confirmNewPasswordInput.value;
    confirmHint.style.display = mismatch ? "block" : "none";
    confirmNewPasswordInput.setCustomValidity(mismatch ? "Passwords don't match." : "");
    return !mismatch;
  }
  newPasswordInput.addEventListener("input", checkPasswordsMatch);
  confirmNewPasswordInput.addEventListener("input", checkPasswordsMatch);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.innerHTML = "";

    if (!checkPasswordsMatch() || newPasswordInput.value !== confirmNewPasswordInput.value) {
      showBanner("Passwords don't match.", "error");
      confirmNewPasswordInput.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving…";

    // verifyOtp above already established a real session for this user --
    // no current password needed here, same reasoning Resetpasswordview.swift
    // documents: clicking a link mailed to an inbox they control already IS
    // the proof of identity for this flow specifically.
    const { error } = await supabase.auth.updateUser({ password: newPasswordInput.value });

    submitBtn.disabled = false;
    submitBtn.textContent = "Set password";

    if (error) {
      showBanner(error.message, "error");
      return;
    }

    form.style.display = "none";
    showBanner("Password set. Redirecting to your dashboard…", "success");
    setTimeout(() => {
      window.location.href = siteURL("advertise-dashboard.html");
    }, 1500);
  });
</script>

</body>
</html>
