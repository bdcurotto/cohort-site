<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password — Cohort Staff</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/advertiser.css?v=17">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="wordmark">Coh<span>o</span>rt</a>
    <nav>
      <a href="admin-login.html">Staff sign in</a>
    </nav>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Set a new password</h1>
    <p class="sub" id="sub-text">Verifying your reset link…</p>

    <div id="banner"></div>

    <form id="reset-form" style="display:none;">
      <div class="field">
        <label for="new_password">New password</label>
        <div class="password-field">
          <input type="password" id="new_password" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" data-target="new_password"></button>
        </div>
        <p class="hint">At least 8 characters.</p>
      </div>
      <div class="field">
        <label for="confirm_new_password">Confirm new password</label>
        <div class="password-field">
          <input type="password" id="confirm_new_password" required minlength="8" autocomplete="new-password">
          <button type="button" class="password-toggle" data-target="confirm_new_password"></button>
        </div>
        <p class="hint" id="confirm-password-hint" style="display:none; color: var(--danger);">Passwords don't match.</p>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn" style="width:100%; margin-top:6px;">Set password</button>
    </form>

    <p class="foot-link" id="request-new-link" style="display:none;">
      <a href="admin-forgot-password.html">Request a new reset link</a>
    </p>
  </div>
</div>

<script type="module">
  // Staff mirror of advertise-reset-password.html, with one real
  // difference from that page, not just a find-and-replace: session
  // storage location.
  //
  // The business version can just call `supabase.auth.getSession()` once
  // auth-redirect.html forwards it here with `?verified=1`, because
  // auth-redirect.html's own temporary Supabase client (see that file's
  // comment above `SUPABASE_URL`) uses the SDK's default storage key --
  // the SAME slot the business-facing `supabase` client
  // (js/supabase-client.js) also uses. So a session that client
  // establishes is already sitting exactly where the business page looks
  // for it.
  //
  // Staff sessions deliberately live in a SEPARATE storage slot
  // (`supabaseAdmin`'s `storageKey: "cohort-staff-auth-token"`, see that
  // client's own comment for why) -- so a session auth-redirect.html
  // establishes on its default-slot temp client is NOT visible to
  // `supabaseAdmin.auth.getSession()` here. Plain `?verified=1` alone
  // would silently fail for staff. Fix: auth-redirect.html's staff branch
  // forwards the actual session tokens in the URL
  // (`?verified=1&access_token=...&refresh_token=...`), and this page
  // explicitly loads them into `supabaseAdmin` via `setSession()` below --
  // same "forward the session, not the spent token" pattern that file's
  // own doc comment already established for the native-app path.
  import { supabaseAdmin as supabase, siteURL, setupPasswordToggles } from "./js/supabase-client.js";

  setupPasswordToggles();

  const subText = document.getElementById("sub-text");
  const banner = document.getElementById("banner");
  const form = document.getElementById("reset-form");
  const requestNewLink = document.getElementById("request-new-link");

  function showBanner(message, type) {
    banner.innerHTML = `<div class="banner ${type}">${message}</div>`;
  }

  const params = new URLSearchParams(window.location.search);
  const alreadyVerified = params.get("verified") === "1";
  const accessToken = params.get("access_token");
  const refreshToken = params.get("refresh_token");
  const tokenHash = params.get("token_hash");
  const type = params.get("type");

  if (alreadyVerified && accessToken && refreshToken) {
    // Forwarded from auth-redirect.html -- load the session it already
    // established into supabaseAdmin's own storage slot explicitly,
    // rather than relying on getSession() to find it on its own (it
    // won't -- see the module comment above).
    const { error } = await supabase.auth.setSession({
      access_token: accessToken,
      refresh_token: refreshToken,
    });
    if (error) {
      subText.textContent = "";
      showBanner("This reset link is invalid or has expired.", "error");
      requestNewLink.style.display = "block";
    } else {
      subText.textContent = "Choose a new password for your account.";
      form.style.display = "block";
    }
  } else if (!tokenHash || type !== "recovery") {
    // Direct-link fallback (e.g. Supabase's email template routing ever
    // changes to point straight here) -- same shape as the advertiser
    // page's own fallback. verifyOtp is called on supabaseAdmin directly
    // here, so unlike the forwarded path above, the session it
    // establishes lands in the right storage slot with no extra step.
    subText.textContent = "";
    showBanner("This reset link is missing or malformed.", "error");
    requestNewLink.style.display = "block";
  } else {
    const { error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" });
    if (error) {
      subText.textContent = "";
      showBanner("This link is invalid or has expired.", "error");
      requestNewLink.style.display = "block";
    } else {
      subText.textContent = "Choose a new password for your account.";
      form.style.display = "block";
    }
  }

  const newPasswordInput = document.getElementById("new_password");
  const confirmNewPasswordInput = document.getElementById("confirm_new_password");
  const confirmHint = document.getElementById("confirm-password-hint");
  const submitBtn = document.getElementById("submit-btn");

  function checkPasswordsMatch() {
    const mismatch = confirmNewPasswordInput.value.length > 0 && newPasswordInput.value !== confirmNewPasswordInput.value;
    confirmHint.style.display = mismatch ? "block" : "none";
    confirmNewPasswordInput.setCustomValidity(mismatch ? "Passwords don't match." : "");
    return !mismatch;
  }
  newPasswordInput.addEventListener("input", checkPasswordsMatch);
  confirmNewPasswordInput.addEventListener("input", checkPasswordsMatch);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.innerHTML = "";

    if (!checkPasswordsMatch() || newPasswordInput.value !== confirmNewPasswordInput.value) {
      showBanner("Passwords don't match.", "error");
      confirmNewPasswordInput.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving…";

    const { error } = await supabase.auth.updateUser({ password: newPasswordInput.value });

    submitBtn.disabled = false;
    submitBtn.textContent = "Set password";

    if (error) {
      showBanner(error.message, "error");
      return;
    }

    form.style.display = "none";
    showBanner("Password set. Redirecting to campaign review…", "success");
    setTimeout(() => {
      window.location.href = siteURL("admin-review.html");
    }, 1500);
  });
</script>

</body>
</html>
