<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign — Cohort Advertising</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/advertiser.css?v=12">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="wordmark">Coh<span>o</span>rt</a>
    <nav>
      <a href="advertise-dashboard.html">Your campaigns</a>
      <a href="advertise-profile.html" class="nav-avatar" id="advertiser-avatar" aria-label="Your profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M4 21V9l8-6 8 6v12M9 21v-6h6v6"/></svg>
      </a>
    </nav>
  </div>
</header>

<script>
  // Paints a cached copy of the signed-in business's avatar into the header
  // immediately, before the async Supabase check (module script further
  // down) can run -- avoids a flash of the generic placeholder icon on
  // every page load. Deliberately vanilla/synchronous, not an import, so
  // it runs the moment the browser reaches this line rather than after the
  // module graph loads. The cache key must stay in sync with
  // js/supabase-client.js's NAV_AVATAR_CACHE_KEY.
  (function () {
    try {
      var cached = JSON.parse(localStorage.getItem("cohort_advertiser_nav_v1") || "null");
      if (!cached) return;
      var avatar = document.getElementById("advertiser-avatar");
      if (!avatar) return;
      avatar.textContent = "";
      if (cached.cover_url) {
        var img = document.createElement("img");
        img.src = cached.cover_url;
        img.alt = "";
        avatar.appendChild(img);
      } else {
        var span = document.createElement("span");
        span.textContent = (cached.name || "?").trim().charAt(0).toUpperCase();
        avatar.appendChild(span);
      }
    } catch (e) {}
  })();
</script>

<div class="wrap" style="padding-top: 24px; max-width: 620px; margin: 0 auto;">
  <a href="advertise-dashboard.html" class="back-link" style="margin: 0 0 20px;">&larr; Back to your campaigns</a>

  <div id="content">
    <p style="color: var(--text-secondary); font-size: 14px;">Loading…</p>
  </div>
</div>

<script type="module">
  // A synchronous inline script right after the header (see above) already
  // painted a cached copy of the avatar on load to avoid a flash of the
  // placeholder icon between pages -- paintNavAvatar()/cacheNavAvatar()
  // below confirm it against the real session and refresh the cache.
  import { supabase, requireBusinessSession, fetchOwnBusiness, paintNavAvatar, cacheNavAvatar, clearNavAvatarCache } from "./js/supabase-client.js";

  const TIER_LABELS = {
    pin_only: "Map Pin — $75",
    feed_and_pin: "Feed + Map Pin — $150",
  };
  const STATUS_LABELS = {
    pending_review: "Pending review",
    approved: "Approved",
    rejected: "Rejected",
    paid: "Paid",
    live: "Live",
    expired: "Expired",
  };

  const content = document.getElementById("content");

  const session = await requireBusinessSession();
  if (session) {
    const business = await fetchOwnBusiness(session);

    if (!business) {
      clearNavAvatarCache();
      content.innerHTML = `<div class="banner error">This account isn't set up as a Cohort advertiser.</div>`;
    } else {
      paintNavAvatar(document.getElementById("advertiser-avatar"), business);
      cacheNavAvatar(business);
      const id = new URLSearchParams(window.location.search).get("id");

      // RLS ("Businesses can view their own campaign submissions",
      // SUPABASE_SCHEMA_TODO.md §190) already scopes this to rows this
      // business owns -- another business's campaign id just comes back
      // null here, same as a typo'd/deleted id, so both read as "not found"
      // rather than leaking whether a row exists.
      const { data: c, error } = await supabase
        .from("campaign_submissions")
        .select("*")
        .eq("id", id)
        .maybeSingle();

      if (error) {
        content.innerHTML = `<div class="banner error">Couldn't load this campaign: ${error.message}</div>`;
      } else if (!c) {
        content.innerHTML = `<div class="banner error">Campaign not found.</div>`;
      } else {
        const date = new Date(c.created_at).toLocaleDateString(undefined, {
          month: "short", day: "numeric", year: "numeric",
        });
        const reviewedDate = c.reviewed_at
          ? new Date(c.reviewed_at).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })
          : null;

        // Video rows' `media_url` is the actual video file -- a real
        // <video> element plays it, with the generated cover frame
        // (thumbnail_url) as the poster shown before playback starts.
        // Photo rows just show the image directly. Back to full card width
        // (Ben preferred the bigger size over the 280px cap tried briefly).
        //
        // No custom expand/fullscreen handling -- tried wrapping in a
        // `.media-frame` with a custom button + a wrapper-level
        // requestFullscreen() override (to keep the 4:5 crop when
        // enlarged), but it fought with the *native* fullscreen button
        // that Safari keeps showing regardless of `controlslist`, and the
        // two colliding left the page in a broken huge/zoomed state on
        // load. Reverted to just the browser's own native `<video controls>`
        // fullscreen -- not perfectly cropped to 4:5, but reliable, since
        // this is a low-traffic internal review page, not the main app.
        let mediaMarkup = "";
        if (c.media_url && c.media_type === "video") {
          mediaMarkup = `
            <div class="media-frame">
              <video controls playsinline ${c.thumbnail_url ? `poster="${c.thumbnail_url}"` : ""}>
                <source src="${c.media_url}">
              </video>
            </div>`;
        } else if (c.media_url) {
          mediaMarkup = `
            <div class="media-frame">
              <img src="${c.media_url}" alt="">
            </div>`;
        }

        // Only a "live" or "expired" submission was ever activated (see
        // admin-review.html's handleActivate), so only those have
        // sponsored_pin_id/ad_campaign_id set for get_campaign_performance()
        // to look up -- everything else (pending/approved/paid/rejected)
        // shows the same card with "-" placeholders instead of a real RPC
        // round trip, so a business always knows this view exists rather
        // than having it appear out of nowhere once a campaign goes live.
        // The RPC (not a raw SELECT) is what lets a business see aggregate
        // counts without being able to read the underlying
        // ad_campaign_events/sponsored_pin_events rows directly -- those
        // stay insert-only.
        let impressions = "–", clicks = "–", ctr = "–", hasData = false, breakdown = "";
        if (c.status === "live" || c.status === "expired") {
          const { data: perf, error: perfError } = await supabase.rpc("get_campaign_performance", {
            p_submission_id: c.id,
          });
          if (!perfError && perf && perf.length) {
            const p = perf[0];
            const impressionsNum = (p.feed_impressions || 0) + (p.pin_impressions || 0);
            const clicksNum = (p.feed_clicks || 0) + (p.pin_clicks || 0);
            impressions = impressionsNum.toLocaleString();
            clicks = clicksNum.toLocaleString();
            ctr = (impressionsNum > 0 ? (clicksNum / impressionsNum) * 100 : 0).toFixed(1) + "%";
            hasData = true;
            breakdown = c.tier === "feed_and_pin"
              ? `<p class="perf-stat-breakdown">${p.feed_impressions || 0} from the feed &middot; ${p.pin_impressions || 0} from the map pin</p>`
              : "";
          }
        }
        const perfHTML = `
          <div class="form-card" style="margin: 24px 0 0;">
            <h2 style="font-size:16px; margin:0 0 14px;">Campaign performance</h2>
            <div class="perf-stat-grid">
              <div class="perf-stat"><span class="biz-stat-value">${impressions}</span><span class="biz-stat-label">Impressions</span></div>
              <div class="perf-stat"><span class="biz-stat-value">${clicks}</span><span class="biz-stat-label">Clicks</span></div>
              <div class="perf-stat"><span class="biz-stat-value">${ctr}</span><span class="biz-stat-label">Click-through rate</span></div>
            </div>
            ${hasData ? breakdown : `<p class="perf-stat-breakdown">No data yet -- this campaign hasn't gone live.</p>`}
          </div>`;

        content.innerHTML = `
          <div class="form-card" style="margin: 0;">
            <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom: 18px;">
              <h1 style="font-size:22px; margin:0;">${escapeHTML(c.headline)}</h1>
              <span class="status-pill status-${c.status}">${STATUS_LABELS[c.status] || c.status}</span>
            </div>

            ${c.status === "rejected" && c.rejection_reason
              ? `<div class="banner error" style="margin-bottom:18px;">${escapeHTML(c.rejection_reason)}</div>`
              : ""}

            ${mediaMarkup}

            <div class="detail-rows">
              <div class="detail-row"><span class="detail-label">Tier</span><span>${TIER_LABELS[c.tier] || c.tier}</span></div>
              ${c.body ? `<div class="detail-row"><span class="detail-label">Description</span><span>${escapeHTML(c.body)}</span></div>` : ""}
              ${c.cta_label ? `<div class="detail-row"><span class="detail-label">Button</span><span>${escapeHTML(c.cta_label)}${c.cta_url ? ` &rarr; ${escapeHTML(c.cta_url)}` : ""}</span></div>` : ""}
              ${c.promotion_address ? `<div class="detail-row"><span class="detail-label">Location</span><span>${escapeHTML(c.promotion_address)}</span></div>` : ""}
              <div class="detail-row"><span class="detail-label">Submitted</span><span>${date}</span></div>
              ${reviewedDate ? `<div class="detail-row"><span class="detail-label">Reviewed</span><span>${reviewedDate}</span></div>` : ""}
            </div>
          </div>
          ${perfHTML}`;
      }
    }
  }

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
