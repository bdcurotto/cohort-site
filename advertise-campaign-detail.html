<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign — Cohort Advertising</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/advertiser.css">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="wordmark">Coh<span>o</span>rt</a>
    <nav>
      <a href="advertise-dashboard.html">Your campaigns</a>
      <a href="advertise-profile.html">Profile</a>
      <a href="#" id="sign-out-link">Sign out</a>
    </nav>
  </div>
</header>

<div class="wrap" style="padding-top: 24px; max-width: 620px; margin: 0 auto;">
  <a href="advertise-dashboard.html" class="back-link" style="margin: 0 0 20px;">&larr; Back to your campaigns</a>

  <div id="content">
    <p style="color: var(--text-secondary); font-size: 14px;">Loading…</p>
  </div>
</div>

<script type="module">
  import { supabase, requireBusinessSession, fetchOwnBusiness, signOutBusiness } from "./js/supabase-client.js";

  document.getElementById("sign-out-link").addEventListener("click", (e) => {
    e.preventDefault();
    signOutBusiness();
  });

  const TIER_LABELS = {
    pin_only: "Map Pin — $75",
    feed_and_pin: "Feed + Map Pin — $150",
  };
  const STATUS_LABELS = {
    pending_review: "Pending review",
    approved: "Approved",
    rejected: "Rejected",
    paid: "Paid",
    live: "Live",
    expired: "Expired",
  };

  const content = document.getElementById("content");

  const session = await requireBusinessSession();
  if (session) {
    const business = await fetchOwnBusiness(session);

    if (!business) {
      content.innerHTML = `<div class="banner error">This account isn't set up as a Cohort advertiser.</div>`;
    } else {
      const id = new URLSearchParams(window.location.search).get("id");

      // RLS ("Businesses can view their own campaign submissions",
      // SUPABASE_SCHEMA_TODO.md §190) already scopes this to rows this
      // business owns -- another business's campaign id just comes back
      // null here, same as a typo'd/deleted id, so both read as "not found"
      // rather than leaking whether a row exists.
      const { data: c, error } = await supabase
        .from("campaign_submissions")
        .select("*")
        .eq("id", id)
        .maybeSingle();

      if (error) {
        content.innerHTML = `<div class="banner error">Couldn't load this campaign: ${error.message}</div>`;
      } else if (!c) {
        content.innerHTML = `<div class="banner error">Campaign not found.</div>`;
      } else {
        const date = new Date(c.created_at).toLocaleDateString(undefined, {
          month: "short", day: "numeric", year: "numeric",
        });
        const reviewedDate = c.reviewed_at
          ? new Date(c.reviewed_at).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })
          : null;

        // Video rows' `media_url` is the actual video file -- a real
        // <video> element plays it, with the generated cover frame
        // (thumbnail_url) as the poster shown before playback starts.
        // Photo rows just show the image directly. Back to full card width
        // (Ben preferred the bigger size over the 280px cap tried briefly).
        //
        // Wrapped in `.media-frame` rather than sized directly on the
        // <video>/<img> -- the browser's native fullscreen button expands
        // the raw element at ITS intrinsic dimensions/orientation, ignoring
        // our object-fit/aspect-ratio crop entirely, which is why "enlarge"
        // showed the video sideways and zoomed in (a landscape-recorded
        // source file, cropped to look portrait in the small preview, but
        // shown raw and unrotated by the browser's own fullscreen mode).
        // `.media-frame:fullscreen` (advertiser.css) keeps the SAME 4:5
        // cropped framing when fullscreened by making the *wrapper* (not
        // the video) go fullscreen -- the video inside just keeps filling
        // it at 100%/cover like it already does at small size.
        let mediaMarkup = "";
        if (c.media_url && c.media_type === "video") {
          mediaMarkup = `
            <div class="media-frame">
              <video controls playsinline controlslist="nofullscreen noremoteplayback" ${c.thumbnail_url ? `poster="${c.thumbnail_url}"` : ""}>
                <source src="${c.media_url}">
              </video>
              <button type="button" class="media-expand" aria-label="Expand">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              </button>
            </div>`;
        } else if (c.media_url) {
          mediaMarkup = `
            <div class="media-frame">
              <img src="${c.media_url}" alt="">
              <button type="button" class="media-expand" aria-label="Expand">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              </button>
            </div>`;
        }

        content.innerHTML = `
          <div class="form-card" style="margin: 0;">
            <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom: 18px;">
              <h1 style="font-size:22px; margin:0;">${escapeHTML(c.headline)}</h1>
              <span class="status-pill status-${c.status}">${STATUS_LABELS[c.status] || c.status}</span>
            </div>

            ${c.status === "rejected" && c.rejection_reason
              ? `<div class="banner error" style="margin-bottom:18px;">${escapeHTML(c.rejection_reason)}</div>`
              : ""}

            ${mediaMarkup}

            <div class="detail-rows">
              <div class="detail-row"><span class="detail-label">Tier</span><span>${TIER_LABELS[c.tier] || c.tier}</span></div>
              ${c.body ? `<div class="detail-row"><span class="detail-label">Description</span><span>${escapeHTML(c.body)}</span></div>` : ""}
              ${c.cta_label ? `<div class="detail-row"><span class="detail-label">Button</span><span>${escapeHTML(c.cta_label)}${c.cta_url ? ` &rarr; ${escapeHTML(c.cta_url)}` : ""}</span></div>` : ""}
              ${c.promotion_address ? `<div class="detail-row"><span class="detail-label">Location</span><span>${escapeHTML(c.promotion_address)}</span></div>` : ""}
              <div class="detail-row"><span class="detail-label">Submitted</span><span>${date}</span></div>
              ${reviewedDate ? `<div class="detail-row"><span class="detail-label">Reviewed</span><span>${reviewedDate}</span></div>` : ""}
            </div>
          </div>`;

        // Fullscreens the WRAPPER div, not the <video>/<img> directly --
        // see .media-frame's own comment in advertiser.css for why that
        // distinction is what keeps the enlarged view right-side-up and
        // still cropped to the same 4:5 portrait framing.
        const mediaFrame = content.querySelector(".media-frame");
        const expandBtn = content.querySelector(".media-expand");
        const videoEl = content.querySelector(".media-frame video");

        function fullscreenFrame() {
          if (mediaFrame.requestFullscreen) {
            mediaFrame.requestFullscreen();
          } else if (mediaFrame.webkitRequestFullscreen) {
            mediaFrame.webkitRequestFullscreen();
          }
        }

        if (mediaFrame && expandBtn) {
          expandBtn.addEventListener("click", fullscreenFrame);
        }

        // `controlslist="nofullscreen"` only hides the native <video>
        // controls' own fullscreen button in Chrome -- Safari ignores it
        // entirely and keeps showing it, so a user there can (and did)
        // fullscreen the raw <video> directly, bringing back the sideways/
        // zoomed bug regardless of our custom button working correctly.
        // This traps that case: if the *video element itself* ever becomes
        // the fullscreen element (rather than our .media-frame wrapper),
        // immediately back out of it and redirect to the wrapper instead --
        // covers every path into fullscreen, not just our own button.
        if (videoEl) {
          const redirectIfVideoWentFullscreen = () => {
            const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
            if (fsEl === videoEl) {
              if (document.exitFullscreen) {
                document.exitFullscreen().then(fullscreenFrame);
              } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
                fullscreenFrame();
              }
            }
          };
          document.addEventListener("fullscreenchange", redirectIfVideoWentFullscreen);
          document.addEventListener("webkitfullscreenchange", redirectIfVideoWentFullscreen);
        }
      }
    }
  }

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
