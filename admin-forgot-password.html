<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Cohort Staff</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/advertiser.css?v=18">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="wordmark">Coh<span>o</span>rt</a>
    <nav>
      <a href="admin-login.html">Staff sign in</a>
    </nav>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="sub">Enter your staff email and we'll send a link to reset your password.</p>

    <div id="banner"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <button type="submit" class="btn-primary" id="submit-btn" style="width:100%; margin-top:6px;">Send reset link</button>
    </form>

    <p class="foot-link"><a href="admin-login.html">Back to sign in</a></p>
  </div>
</div>

<script type="module">
  // Staff mirror of advertise-forgot-password.html -- see that file's own
  // comments for the anti-enumeration reasoning (same-message-either-way).
  // Uses `supabaseAdmin`, not `supabase` -- see js/supabase-client.js's own
  // comment on why staff sessions live in a separate storage slot from
  // business ones. `resetPasswordForEmail`'s `redirectTo` here is
  // effectively documentation, not the real routing mechanism: every
  // Reset Password email (staff or business) actually lands on
  // auth-redirect.html first, because that's what the Supabase email
  // template itself hardcodes -- see auth-redirect.html's own comment
  // block and its staff-detection branch for how it gets forwarded here.
  import { supabaseAdmin as supabase, siteURL } from "./js/supabase-client.js";

  const form = document.getElementById("forgot-form");
  const banner = document.getElementById("banner");
  const submitBtn = document.getElementById("submit-btn");

  function showBanner(message, type) {
    banner.innerHTML = `<div class="banner ${type}">${message}</div>`;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    const email = document.getElementById("email").value.trim();

    await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: siteURL("admin-reset-password.html"),
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "Send reset link";

    // Same anti-enumeration reasoning as the advertiser page: this message
    // never reveals whether the address actually belongs to a staff
    // account.
    form.reset();
    form.style.display = "none";
    showBanner(
      "If that email is associated with a Cohort staff account, a reset link is on its way. It may take a few minutes to arrive.",
      "success"
    );
  });
</script>

</body>
</html>
