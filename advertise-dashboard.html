<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your campaigns — Cohort Advertising</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/advertiser.css?v=8">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="wordmark">Coh<span>o</span>rt</a>
    <nav>
      <a href="advertise-profile.html" class="nav-avatar" id="advertiser-avatar" aria-label="Your profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M4 21V9l8-6 8 6v12M9 21v-6h6v6"/></svg>
      </a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="dash-header">
    <div>
      <h1 id="business-name">Your campaigns</h1>
      <p class="sub">Track every campaign you've submitted, from review through go-live.</p>
    </div>
    <div class="dash-actions">
      <a href="advertise-new-campaign.html" class="btn-primary">+ New campaign</a>
    </div>
  </div>

  <div id="content">
    <p style="color: var(--text-secondary); font-size: 14px;">Loading…</p>
  </div>
</div>

<script type="module">
  import { supabase, requireBusinessSession, fetchOwnBusiness } from "./js/supabase-client.js";

  // Paints the signed-in business's logo (or a fallback initial) into the
  // nav-cta-style circle in the header, replacing what used to be a plain
  // "Profile" text link -- see advertise.html for the original version of
  // this pattern.
  function paintNavAvatar(business) {
    const avatar = document.getElementById("advertiser-avatar");
    if (!avatar || !business) return;
    avatar.setAttribute("aria-label", business.name ? `${business.name} profile` : "Your profile");
    avatar.replaceChildren();
    if (business.cover_url) {
      const img = document.createElement("img");
      img.src = business.cover_url;
      img.alt = "";
      avatar.appendChild(img);
    } else {
      const span = document.createElement("span");
      span.textContent = (business.name || "?").trim().charAt(0).toUpperCase();
      avatar.appendChild(span);
    }
  }

  const TIER_LABELS = {
    pin_only: "Map Pin — $75",
    feed_and_pin: "Feed + Map Pin — $150",
  };
  const STATUS_LABELS = {
    pending_review: "Pending review",
    approved: "Approved",
    rejected: "Rejected",
    paid: "Paid",
    live: "Live",
    expired: "Expired",
  };

  const session = await requireBusinessSession();
  if (session) {
    const business = await fetchOwnBusiness(session);
    const content = document.getElementById("content");

    if (!business) {
      content.innerHTML = `<div class="banner error">This account isn't set up as a Cohort advertiser.</div>`;
    } else {
      paintNavAvatar(business);
      document.getElementById("business-name").textContent = business.name;

      const { data: campaigns, error } = await supabase
        .from("campaign_submissions")
        .select("*")
        .eq("business_id", business.id)
        .order("created_at", { ascending: false });

      if (error) {
        content.innerHTML = `<div class="banner error">Couldn't load your campaigns: ${error.message}</div>`;
      } else if (!campaigns || campaigns.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            You haven't submitted a campaign yet.<br>
            <a href="advertise-new-campaign.html" class="btn-primary" style="margin-top:16px;">Create your first campaign</a>
          </div>`;
      } else {
        content.innerHTML = `<div class="campaign-list">${campaigns
          .map((c) => {
            const date = new Date(c.created_at).toLocaleDateString(undefined, {
              month: "short", day: "numeric", year: "numeric",
            });
            // Video rows' `media_url` points at the actual video file, which
            // a plain <img> can't decode (showed as a broken-image icon) --
            // `thumbnail_url` is the generated cover frame for those.
            // `media_type` predates thumbnail_url, so it's read defensively
            // (`c.media_type === "video"`, not `!== "photo"`) in case an
            // older row somehow has neither set.
            const thumbSrc = c.media_type === "video" ? c.thumbnail_url : c.media_url;
            const img = thumbSrc
              ? `<img src="${thumbSrc}" alt="">`
              : `<div style="width:56px;height:56px;border-radius:12px;background:var(--bg-alt);flex-shrink:0;"></div>`;
            return `
              <a class="campaign-card" href="advertise-campaign-detail.html?id=${c.id}">
                ${img}
                <div class="info">
                  <p class="headline">${escapeHTML(c.headline)}</p>
                  <p class="meta">${TIER_LABELS[c.tier] || c.tier} · Submitted ${date}</p>
                  ${c.status === "rejected" && c.rejection_reason ? `<p class="meta" style="color: var(--danger); margin-top:4px;">${escapeHTML(c.rejection_reason)}</p>` : ""}
                </div>
                <span class="status-pill status-${c.status}">${STATUS_LABELS[c.status] || c.status}</span>
              </a>`;
          })
          .join("")}</div>`;
      }
    }
  }

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
