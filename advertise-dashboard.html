<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your campaigns — Cohort Advertising</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/advertiser.css?v=17">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="wordmark">Coh<span>o</span>rt</a>
    <nav>
      <a href="advertise-profile.html" class="nav-avatar" id="advertiser-avatar" aria-label="Your profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M4 21V9l8-6 8 6v12M9 21v-6h6v6"/></svg>
      </a>
    </nav>
  </div>
</header>

<script>
  // Paints a cached copy of the signed-in business's avatar into the header
  // immediately, before the async Supabase check (module script further
  // down) can run -- avoids a flash of the generic placeholder icon on
  // every page load. Deliberately vanilla/synchronous, not an import, so
  // it runs the moment the browser reaches this line rather than after the
  // module graph loads. The cache key must stay in sync with
  // js/supabase-client.js's NAV_AVATAR_CACHE_KEY.
  (function () {
    try {
      var cached = JSON.parse(localStorage.getItem("cohort_advertiser_nav_v1") || "null");
      if (!cached) return;
      var avatar = document.getElementById("advertiser-avatar");
      if (!avatar) return;
      avatar.textContent = "";
      if (cached.cover_url) {
        var img = document.createElement("img");
        img.src = cached.cover_url;
        img.alt = "";
        avatar.appendChild(img);
      } else {
        var span = document.createElement("span");
        span.textContent = (cached.name || "?").trim().charAt(0).toUpperCase();
        avatar.appendChild(span);
      }
    } catch (e) {}
  })();
</script>

<div class="wrap">
  <div class="dash-header">
    <div>
      <h1 id="business-name">Your campaigns</h1>
      <p class="sub">Track every campaign you've submitted, from review through go-live.</p>
    </div>
    <div class="dash-actions">
      <a href="advertise-new-campaign.html" class="btn-primary">+ New campaign</a>
    </div>
  </div>

  <div id="stats"></div>

  <div id="content">
    <p style="color: var(--text-secondary); font-size: 14px;">Loading…</p>
  </div>
</div>

<script type="module">
  // A synchronous inline script right after the header (see above) already
  // painted a cached copy of the avatar on load to avoid a flash of the
  // placeholder icon between pages -- paintNavAvatar()/cacheNavAvatar()
  // below confirm it against the real session and refresh the cache.
  import { supabase, requireBusinessSession, fetchOwnBusiness, paintNavAvatar, cacheNavAvatar, clearNavAvatarCache } from "./js/supabase-client.js";

  const TIER_LABELS = {
    pin_only: "Map Pin — $75",
    feed_and_pin: "Feed + Map Pin — $150",
  };
  const STATUS_LABELS = {
    pending_review: "Pending review",
    approved: "Approved",
    rejected: "Rejected",
    paid: "Paid",
    live: "Live",
    expired: "Expired",
  };
  // Declared here, before the top-level `await` below -- this script has a
  // top-level await (`requireBusinessSession()`), which means everything
  // after it in this module's linear execution order doesn't actually run
  // until that await resolves. `renderCampaigns()` (called inside the
  // `if (session)` block further down) needs these two, so they have to be
  // initialized before that await, not after it, or referencing them
  // throws a "Cannot access before initialization" TDZ error the first
  // time the page loads -- exactly what left the page stuck on "Loading…"
  // before this fix.
  let activeFilter = "all";
  // "Awaiting Payment" filters on status "approved" -- in this workflow
  // (pending_review -> approved -> paid -> live) approved literally means
  // staff signed off and the business still needs to pay before it goes
  // live, so the tab is labeled for what the business needs to DO next
  // rather than the raw status name (Ben's ask, 2026-09-16).
  const FILTER_TABS = [
    { key: "all", label: "All" },
    { key: "live", label: "Live" },
    { key: "expired", label: "Expired" },
    { key: "pending_review", label: "Pending" },
    { key: "approved", label: "Awaiting Payment" },
    { key: "rejected", label: "Rejected" },
  ];

  const session = await requireBusinessSession();
  if (session) {
    const business = await fetchOwnBusiness(session);
    const content = document.getElementById("content");

    if (!business) {
      clearNavAvatarCache();
      content.innerHTML = `<div class="banner error">This account isn't set up as a Cohort advertiser.</div>`;
    } else {
      paintNavAvatar(document.getElementById("advertiser-avatar"), business);
      cacheNavAvatar(business);
      document.getElementById("business-name").textContent = business.name;

      // Aggregate stats across every campaign this business has ever run --
      // spend, live count, and impressions/clicks summed across both feed
      // and map-pin placements. ad_orders has no RLS policy for businesses
      // (staff-only by design, see SUPABASE_SCHEMA_TODO.md), so this reads
      // through a SECURITY DEFINER RPC keyed off auth.uid() rather than a
      // direct table select, same pattern as get_campaign_performance().
      const { data: stats } = await supabase.rpc("get_business_dashboard_stats");
      if (stats && stats.length) {
        const s = stats[0];
        const spent = ((s.total_spent_cents || 0) / 100).toLocaleString(undefined, {
          style: "currency", currency: "USD", minimumFractionDigits: 0, maximumFractionDigits: 0,
        });
        document.getElementById("stats").innerHTML = `
          <div class="biz-stat-grid">
            <div class="biz-stat" style="cursor:default;">
              <span class="biz-stat-value">${spent}</span>
              <span class="biz-stat-label">Total spent</span>
            </div>
            <div class="biz-stat" style="cursor:default;">
              <span class="biz-stat-value">${s.currently_live || 0}</span>
              <span class="biz-stat-label">Currently live</span>
            </div>
            <div class="biz-stat" style="cursor:default;">
              <span class="biz-stat-value">${(s.total_impressions || 0).toLocaleString()}</span>
              <span class="biz-stat-label">Total impressions</span>
            </div>
            <div class="biz-stat" style="cursor:default;">
              <span class="biz-stat-value">${(s.total_clicks || 0).toLocaleString()}</span>
              <span class="biz-stat-label">Total clicks</span>
            </div>
          </div>`;
      }

      // ad_campaigns.ends_at / sponsored_pins.ends_at are the only places a
      // campaign's expiration actually lives (campaign_submissions itself
      // has no ends_at column) -- both are set once at activation via the
      // ad_campaign_id/sponsored_pin_id FKs, and both tables carry a
      // `select ... using (true)` policy for any authenticated user (same
      // one the feed/map already rely on), so embedding them here is safe.
      // A submission that isn't live yet (pending_review/approved/rejected/
      // paid) has null FKs, so both embeds come back null -- handled below.
      const { data: campaigns, error } = await supabase
        .from("campaign_submissions")
        .select("*, ad_campaigns(ends_at), sponsored_pins(ends_at)")
        .eq("business_id", business.id)
        .order("created_at", { ascending: false });

      if (error) {
        content.innerHTML = `<div class="banner error">Couldn't load your campaigns: ${error.message}</div>`;
      } else if (!campaigns || campaigns.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            You haven't submitted a campaign yet.<br>
            <a href="advertise-new-campaign.html" class="btn-primary" style="margin-top:16px;">Create your first campaign</a>
          </div>`;
      } else {
        // Filter tabs (Ben's ask, 2026-09-16) -- same shape/CSS classes
        // (.review-filter-tabs/.review-filter-tab, shared advertiser.css)
        // as admin-review.html's own filter tabs, just a narrower set of
        // statuses since a business doesn't need "Approved"/"Awaiting
        // payment" split out the way staff do -- those two (plus "Paid")
        // still show up under "All", just without their own dedicated tab.
        // `campaigns` is captured in this closure rather than re-fetched
        // on every filter click.
        renderCampaigns(campaigns);
      }
    }
  }

  function renderCampaigns(campaigns) {
    const content = document.getElementById("content");
    const tabsHTML = `<div class="review-filter-tabs">${FILTER_TABS.map((tab) => {
      const count = tab.key === "all" ? campaigns.length : campaigns.filter((c) => c.status === tab.key).length;
      return `<button type="button" class="review-filter-tab${tab.key === activeFilter ? " active" : ""}" data-filter="${tab.key}">${tab.label} (${count})</button>`;
    }).join("")}</div>`;

    const filtered = activeFilter === "all" ? campaigns : campaigns.filter((c) => c.status === activeFilter);

    const listHTML = filtered.length === 0
      ? `<div class="empty-state">No campaigns match this filter.</div>`
      : `<div class="campaign-list">${filtered
          .map((c) => {
            const date = new Date(c.created_at).toLocaleDateString(undefined, {
              month: "short", day: "numeric", year: "numeric",
            });
            // Whichever of the two embeds is populated (a submission only
            // ever ends up with one, depending on its tier) -- feed_and_pin
            // has both, pin_only has only sponsored_pins, so ad_campaigns
            // is checked first but either can supply the date.
            const endsAtRaw = c.ad_campaigns?.ends_at || c.sponsored_pins?.ends_at || null;
            const endsAtDate = endsAtRaw
              ? new Date(endsAtRaw).toLocaleDateString(undefined, {
                  month: "short", day: "numeric", year: "numeric",
                })
              : null;
            const expiryText = c.status === "live" && endsAtDate
              ? ` · Expires ${endsAtDate}`
              : c.status === "expired" && endsAtDate
              ? ` · Expired ${endsAtDate}`
              : "";
            // Video rows' `media_url` points at the actual video file, which
            // a plain <img> can't decode (showed as a broken-image icon) --
            // `thumbnail_url` is the generated cover frame for those.
            // `media_type` predates thumbnail_url, so it's read defensively
            // (`c.media_type === "video"`, not `!== "photo"`) in case an
            // older row somehow has neither set.
            const thumbSrc = c.media_type === "video" ? c.thumbnail_url : c.media_url;
            const img = thumbSrc
              ? `<img src="${thumbSrc}" alt="">`
              : `<div style="width:56px;height:56px;border-radius:12px;background:var(--bg-alt);flex-shrink:0;"></div>`;
            // Duplicate Campaign (Ben's ask, 2026-09-16) -- only offered for
            // rejected/expired campaigns, since those are the ones a
            // business would actually want to resubmit from scratch; a
            // pending/approved/paid/live campaign is still an active
            // submission, not something to fork a copy of. Sits as a
            // sibling of .campaign-card-link (see advertiser.css) rather
            // than nested inside it -- a <a> can't nest inside another
            // <a>, so the clickable tile got split into an outer
            // .campaign-card wrapper (the visible bordered tile, not
            // itself a link) and an inner .campaign-card-link anchor
            // covering just the image/info/status-pill row. That keeps
            // native link behavior (middle-click/cmd-click to open in a
            // new tab, right-click "copy link") on the main card click,
            // while this link renders as its own real sibling anchor
            // underneath, left-aligned under the subtitle instead of
            // floating outside the tile (Ben's ask, 2026-09-16).
            const dupHTML = (c.status === "rejected" || c.status === "expired")
              ? `<a class="campaign-duplicate-link" href="advertise-new-campaign.html?duplicate=${c.id}">Duplicate this campaign</a>`
              // Edit a pending campaign (Ben's ask, 2026-09-16) -- a
              // business previously had no way to fix a typo or swap a
              // photo on a submission still awaiting review; they'd have
              // to wait for a rejection and use Duplicate instead. Only
              // offered for pending_review, not approved/paid -- once
              // staff has acted on it, editing the content out from under
              // that decision would be confusing (and payment links are
              // already priced off the tier/media_type staff saw at
              // approval time). Same .campaign-duplicate-link styling --
              // this is the same "secondary action on a card" pattern, not
              // a new visual language.
              : c.status === "pending_review"
              ? `<a class="campaign-duplicate-link" href="advertise-new-campaign.html?edit=${c.id}">Edit this campaign</a>`
              : "";
            return `
              <div class="campaign-card">
                <a class="campaign-card-link" href="advertise-campaign-detail.html?id=${c.id}">
                  ${img}
                  <div class="info">
                    <p class="headline">${escapeHTML(c.headline)}</p>
                    <p class="meta">${TIER_LABELS[c.tier] || c.tier} · Submitted ${date}${expiryText}</p>
                    ${c.status === "rejected" && c.rejection_reason ? `<p class="meta" style="color: var(--danger); margin-top:4px;">${escapeHTML(c.rejection_reason)}</p>` : ""}
                  </div>
                  <span class="status-pill status-${c.status}">${STATUS_LABELS[c.status] || c.status}</span>
                </a>
                ${dupHTML}
              </div>`;
          })
          .join("")}</div>`;

    content.innerHTML = tabsHTML + listHTML;

    // Delegated so it keeps working after every re-render (innerHTML above
    // replaces the buttons each time) -- same pattern admin-review.html's
    // own filter tabs use.
    content.querySelectorAll(".review-filter-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.filter;
        renderCampaigns(campaigns);
      });
    });
  }

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
