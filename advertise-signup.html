<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your advertiser account — Cohort</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/advertiser.css">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="wordmark">Coh<span>o</span>rt</a>
    <nav>
      <a href="advertise.html">Advertise</a>
      <a href="advertise-login.html">Sign in</a>
    </nav>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Create your advertiser account</h1>
    <p class="sub">For businesses only — this is separate from a student Cohort account.</p>

    <div id="banner"></div>

    <form id="signup-form">
      <div class="field">
        <label for="business_name">Business name</label>
        <input type="text" id="business_name" required autocomplete="organization">
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="" disabled selected>Select a category</option>
          <option value="restaurant">Restaurant</option>
          <option value="bar">Bar</option>
          <option value="coffee_shop">Coffee Shop</option>
          <option value="retail">Retail</option>
          <option value="grocery">Grocery</option>
          <option value="fitness">Fitness</option>
          <option value="salon_beauty">Salon &amp; Beauty</option>
          <option value="health_wellness">Health &amp; Wellness</option>
          <option value="housing">Housing</option>
          <option value="automotive">Automotive</option>
          <option value="education">Education</option>
          <option value="activity">Activity</option>
          <option value="venue">Venue</option>
          <option value="professional_services">Professional Services</option>
          <option value="technology">Technology</option>
          <option value="nonprofit">Nonprofit</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="location_name">Address</label>
        <input type="text" id="location_name" placeholder="Street address, city, state" required>
        <p class="hint">Used to place your pin on the Find map near your campus.</p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
        <p class="hint">At least 8 characters.</p>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary" id="submit-btn" style="width:100%; margin-top:6px;">Create account</button>
    </form>

    <p class="foot-link">Already have an account? <a href="advertise-login.html">Sign in</a></p>
  </div>
</div>

<script type="module">
  import { supabase, siteURL } from "./js/supabase-client.js";

  const form = document.getElementById("signup-form");
  const banner = document.getElementById("banner");
  const submitBtn = document.getElementById("submit-btn");

  function showBanner(message, type) {
    banner.innerHTML = `<div class="banner ${type}">${message}</div>`;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Creating account…";

    const business_name = document.getElementById("business_name").value.trim();
    const category = document.getElementById("category").value.trim();
    const location_name = document.getElementById("location_name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirm_password = document.getElementById("confirm_password").value;

    if (password !== confirm_password) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Create account";
      showBanner("Passwords don't match.", "error");
      return;
    }

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: siteURL("advertise-login.html"),
        data: {
          account_type: "business",
          business_name,
          category,
          address: location_name,
        },
      },
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "Create account";

    if (error) {
      showBanner(error.message, "error");
      return;
    }

    // Supabase quietly no-ops signUp for an email that already has a
    // confirmed account (still an authentic Cohort student account, most
    // likely -- app and website share one Supabase project) rather than
    // returning an error, so a stolen/probed email can't be confirmed to
    // exist. The tell is an empty identities array on the returned user --
    // catch that here so this doesn't read as "check your email" for an
    // email that was never actually sent one.
    if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
      showBanner(
        "That email is already associated with a Cohort account. Business accounts need a different email address than your student Cohort account.",
        "error"
      );
      return;
    }

    form.reset();
    form.style.display = "none";
    showBanner(
      "Check your email to confirm your account, then sign in to submit your first campaign.",
      "success"
    );
  });
</script>

</body>
</html>
