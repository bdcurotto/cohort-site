<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — Cohort Advertising</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/advertiser.css?v=3">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="wordmark">Coh<span>o</span>rt</a>
    <nav>
      <a href="advertise-login.html">Sign in</a>
    </nav>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Reset your password</h1>
    <p class="sub">Enter the email on your advertiser account and we'll send a link to reset your password.</p>

    <div id="banner"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <button type="submit" class="btn-primary" id="submit-btn" style="width:100%; margin-top:6px;">Send reset link</button>
    </form>

    <p class="foot-link"><a href="advertise-login.html">Back to sign in</a></p>
  </div>
</div>

<script type="module">
  import { supabase, siteURL } from "./js/supabase-client.js";

  const form = document.getElementById("forgot-form");
  const banner = document.getElementById("banner");
  const submitBtn = document.getElementById("submit-btn");

  function showBanner(message, type) {
    banner.innerHTML = `<div class="banner ${type}">${message}</div>`;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    banner.innerHTML = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    const email = document.getElementById("email").value.trim();

    await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: siteURL("advertise-reset-password.html"),
    });

    submitBtn.disabled = false;
    submitBtn.textContent = "Send reset link";

    // resetPasswordForEmail succeeds the same way whether or not this
    // address belongs to a real account (Supabase's own anti-enumeration
    // behavior) -- so the confirmation message below is deliberately the
    // same either way, rather than branching on `error`, which would leak
    // exactly the distinction Supabase is trying to hide.
    form.reset();
    form.style.display = "none";
    showBanner(
      "If that email is associated with a Cohort advertiser account, a reset link is on its way. It may take a few minutes to arrive.",
      "success"
    );
  });
</script>

</body>
</html>
