<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign review — Cohort</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/advertiser.css?v=7">
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="wordmark">Coh<span>o</span>rt</a>
    <nav>
      <a href="#" id="sign-out-link">Sign out</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="dash-header">
    <div>
      <h1>Campaign review</h1>
      <p class="sub">Approve, reject, and activate advertiser submissions.</p>
    </div>
  </div>

  <div id="content">
    <p style="color: var(--text-secondary); font-size: 14px;">Loading…</p>
  </div>
</div>

<script type="module">
  import { supabase, requireStaffSession, fetchOwnStaff, signOutStaff } from "./js/supabase-client.js";

  document.getElementById("sign-out-link").addEventListener("click", (e) => {
    e.preventDefault();
    signOutStaff();
  });

  const TIER_LABELS = {
    pin_only: "Map Pin — $75",
    feed_and_pin: "Feed + Map Pin — $150",
  };
  const STATUS_LABELS = {
    pending_review: "Pending review",
    approved: "Approved",
    rejected: "Rejected",
    paid: "Paid",
    live: "Live",
    expired: "Expired",
  };

  // Same tier prices as the Advertising Admin Guide (§6) -- kept as
  // constants here rather than read from anywhere else since these are
  // business decisions (pricing), not derived data.
  const TIER_BASE_CENTS = { pin_only: 7500, feed_and_pin: 15000 };
  const VIDEO_UPCHARGE_CENTS = 5000;
  // Reusable Payment Links (§6). Three fixed prices now cover every
  // combination this app can produce: the two flat tier prices, plus a
  // third link for the one variable case (feed_and_pin + video, $200 --
  // added 2026-08-21 once that combination came up often enough in
  // testing to be worth a dedicated link instead of a manual Stripe
  // Invoice each time). Keyed by tier normally; the video-upcharge case
  // is looked up separately in paymentLinkFor() below since it isn't a
  // real tier of its own.
  const PAYMENT_LINKS = {
    pin_only: "https://buy.stripe.com/cNi7sM73A0nM2Gq0Ir9oc01",
    feed_and_pin: "https://buy.stripe.com/6oU4gAew2fiG5SC9eX9oc00",
    feed_and_pin_video: "https://buy.stripe.com/7sYeVe1JggmKftc3UD9oc02",
  };
  const ORDER_DAYS = 30;

  function amountInfo(row) {
    const base = TIER_BASE_CENTS[row.tier] ?? 0;
    const hasUpcharge = row.tier === "feed_and_pin" && row.media_type === "video";
    const cents = base + (hasUpcharge ? VIDEO_UPCHARGE_CENTS : 0);
    return { cents, hasUpcharge };
  }

  function paymentLinkFor(row) {
    const { hasUpcharge } = amountInfo(row);
    return hasUpcharge ? PAYMENT_LINKS.feed_and_pin_video : PAYMENT_LINKS[row.tier];
  }

  const content = document.getElementById("content");

  // Rows fetched once per load/action, re-rendered from this cache for
  // pure-UI actions (like toggling a preview open) so those don't need a
  // network round trip. `expandedIds` tracks which cards have their
  // rendered-ad preview open, surviving re-renders since it lives outside
  // both functions.
  let lastRows = [];
  const expandedIds = new Set();
  let activeFilter = "all";

  // `campaign_submissions.status` alone can't distinguish "approved, no
  // order yet" from "approved, order created, still waiting on payment" --
  // both are stored as status = 'approved', split only by whether
  // `order_id` is set (see the state-machine note above renderRow). Filter
  // tabs need that finer split, so this computes a UI-only "sub-status"
  // rather than adding a real column for something derivable.
  function subStatus(row) {
    if (row.status === "approved" && row.order_id) return "awaiting_payment";
    return row.status;
  }

  const FILTER_TABS = [
    { key: "all", label: "All" },
    { key: "pending_review", label: "Pending" },
    { key: "approved", label: "Approved" },
    { key: "awaiting_payment", label: "Awaiting payment" },
    { key: "paid", label: "Paid" },
    { key: "live", label: "Live" },
    { key: "rejected", label: "Rejected" },
    { key: "expired", label: "Expired" },
  ];

  // "12 days left" / "Expired 3 days ago" for a live campaign, from the
  // order's ends_at -- so staff can tell at a glance when a live campaign
  // will naturally drop out of active_ad_campaigns/active_sponsored_pins
  // (both already filter on ends_at server-side; this is read-only display,
  // nothing here changes when a campaign actually stops showing).
  function expiryNote(order) {
    if (!order?.ends_at) return "Live.";
    const daysLeft = Math.ceil((new Date(order.ends_at) - Date.now()) / 86400000);
    if (daysLeft > 0) return `Live — ${daysLeft} day${daysLeft === 1 ? "" : "s"} left.`;
    if (daysLeft === 0) return "Live — expires today.";
    return `Live — ended ${Math.abs(daysLeft)} day${Math.abs(daysLeft) === 1 ? "" : "s"} ago (rows are still active=true; §5.1 says clean these up periodically).`;
  }

  const session = await requireStaffSession();
  if (session) {
    const staff = await fetchOwnStaff(session);
    if (!staff) {
      content.innerHTML = `<div class="banner error">This account isn't set up for admin access.</div>`;
    } else {
      await loadAndRender();
    }
  }

  async function loadAndRender() {
    content.innerHTML = `<p style="color: var(--text-secondary); font-size: 14px;">Loading…</p>`;

    // Embeds ride the single FK each way (campaign_submissions.business_id
    // -> businesses.id, campaign_submissions.order_id -> ad_orders.id) --
    // safe from PostgREST's "ambiguous embed" error, which only bites when
    // a second FK path exists between the same two tables.
    const { data: rows, error } = await supabase
      .from("campaign_submissions")
      .select("*, business:businesses(name, category, address, contact_email, cover_url), order:ad_orders(*)")
      .order("created_at", { ascending: false });

    if (error) {
      content.innerHTML = `<div class="banner error">Couldn't load submissions: ${error.message}</div>`;
      return;
    }
    lastRows = rows || [];
    render();
  }

  function render() {
    if (lastRows.length === 0) {
      content.innerHTML = `<div class="empty-state">No campaign submissions yet.</div>`;
      return;
    }

    const tabsHTML = `<div class="review-filter-tabs">${FILTER_TABS.map((tab) => {
      const count = tab.key === "all" ? lastRows.length : lastRows.filter((r) => subStatus(r) === tab.key).length;
      return `<button type="button" class="review-filter-tab${tab.key === activeFilter ? " active" : ""}" data-filter="${tab.key}">${tab.label} (${count})</button>`;
    }).join("")}</div>`;

    const filtered = activeFilter === "all" ? lastRows : lastRows.filter((r) => subStatus(r) === activeFilter);

    if (filtered.length === 0) {
      content.innerHTML = tabsHTML + `<div class="empty-state">Nothing in this filter.</div>`;
      return;
    }

    // Grouped by advertiser (Ben's ask: with more than one business
    // submitting, a flat chronological list gets hard to scan) --
    // alphabetical by business name so the list order is predictable and
    // doesn't reshuffle as submissions change status. Within each group,
    // pending-review still surfaces first, then newest first -- same
    // priority as before grouping existed.
    const groups = new Map();
    for (const row of filtered) {
      const key = row.business_id || "unknown";
      if (!groups.has(key)) groups.set(key, { businessId: key, business: row.business, rows: [] });
      groups.get(key).rows.push(row);
    }
    const sortedGroups = [...groups.values()].sort((a, b) =>
      (a.business?.name || "").localeCompare(b.business?.name || "")
    );
    for (const group of sortedGroups) {
      group.rows.sort((a, b) => {
        if (a.status === "pending_review" && b.status !== "pending_review") return -1;
        if (b.status === "pending_review" && a.status !== "pending_review") return 1;
        return new Date(b.created_at) - new Date(a.created_at);
      });
    }

    content.innerHTML = tabsHTML + sortedGroups
      .map((group) => `
        <div class="review-group">
          <div class="review-group-header">
            <span class="review-group-name">${group.business && group.businessId !== "unknown" ? `<a href="admin-business-detail.html?id=${group.businessId}">${escapeHTML(group.business.name)}</a>` : (group.business ? escapeHTML(group.business.name) : "Unknown business")}</span>
            ${group.business?.category ? `<span class="review-group-meta">${escapeHTML(group.business.category)}</span>` : ""}
            ${group.business?.contact_email ? `<span class="review-group-meta">${escapeHTML(group.business.contact_email)}</span>` : ""}
          </div>
          <div class="review-list">${group.rows.map(renderRow).join("")}</div>
        </div>`)
      .join("");
  }

  function reviewMediaHTML(row) {
    const thumbSrc = row.media_type === "video" ? row.thumbnail_url : row.media_url;
    const inner = thumbSrc
      ? `<img src="${thumbSrc}" alt="" class="review-thumb">`
      : `<div class="review-thumb review-thumb-empty"></div>`;
    // Links straight to the raw file (the actual video, not just its
    // cover frame, for video rows) -- opens in a new tab at the browser's
    // own native size/controls. Deliberately not a custom viewer here:
    // this exact app already tried a wrapper-level fullscreen override
    // for video on the campaign detail page and it broke twice (see
    // SUPABASE_SCHEMA_TODO.md's fullscreen sections) -- a plain link
    // sidesteps that whole failure mode entirely.
    return row.media_url
      ? `<a href="${row.media_url}" target="_blank" rel="noopener">${inner}</a>`
      : inner;
  }

  function renderRow(row) {
    const date = new Date(row.created_at).toLocaleDateString(undefined, {
      month: "short", day: "numeric", year: "numeric",
    });
    const thumb = reviewMediaHTML(row);

    const biz = row.business;
    const { cents, hasUpcharge } = amountInfo(row);
    const dollars = (cents / 100).toFixed(0);
    const expanded = expandedIds.has(row.id);

    let actionsHTML = "";

    if (row.status === "pending_review") {
      actionsHTML = `
        <button type="button" class="btn-primary review-approve" data-id="${row.id}">Approve</button>
        <button type="button" class="btn-secondary review-reject" data-id="${row.id}">Reject</button>`;
    } else if (row.status === "approved" && !row.order_id) {
      actionsHTML = `
        <div class="review-order-note">
          Amount due: <strong>$${dollars}</strong>${hasUpcharge ? " (includes $50 video upcharge)" : ""}
        </div>
        <button type="button" class="btn-primary review-create-order" data-id="${row.id}">Create order</button>`;
    } else if (row.status === "approved" && row.order_id && row.order) {
      const link = paymentLinkFor(row);
      const linkOrNote = `Payment Link: <a href="${link}" target="_blank" rel="noopener">${link}</a>
           <button type="button" class="review-copy-link" data-link="${link}">Copy</button>`;
      actionsHTML = `
        <div class="review-order-note">
          Order created — awaiting payment. Amount: <strong>$${dollars}</strong><br>${linkOrNote}
        </div>
        <button type="button" class="btn-primary review-mark-paid" data-id="${row.id}">Mark as paid</button>`;
    } else if (row.status === "paid") {
      actionsHTML = `
        <div class="review-order-note">Paid. Ready to go live.</div>
        <button type="button" class="btn-primary review-activate" data-id="${row.id}">Activate campaign</button>`;
    } else if (row.status === "live") {
      actionsHTML = `<div class="review-order-note">${expiryNote(row.order)}</div>`;
    } else if (row.status === "rejected") {
      actionsHTML = `
        ${row.rejection_reason ? `<div class="review-order-note review-rejected-note">${escapeHTML(row.rejection_reason)}</div>` : ""}
        <button type="button" class="btn-secondary review-undo-reject" data-id="${row.id}">Undo rejection</button>`;
    }

    return `
      <div class="review-card">
        <div class="review-card-top">
          ${thumb}
          <div class="review-card-info">
            <p class="headline">${escapeHTML(row.headline)}</p>
            <p class="meta">${biz ? escapeHTML(biz.name) : "Unknown business"} · ${TIER_LABELS[row.tier] || row.tier} · Submitted ${date}</p>
            ${row.body ? `<p class="meta" style="margin-top:6px;">${escapeHTML(row.body)}</p>` : ""}
            ${row.cta_label ? `<p class="meta">Button: ${escapeHTML(row.cta_label)}${row.cta_url ? ` &rarr; ${escapeHTML(row.cta_url)}` : ""}</p>` : ""}
            ${row.promotion_address ? `<p class="meta review-promo-address">Different location for this deal: ${escapeHTML(row.promotion_address)}</p>` : ""}
            ${biz && biz.contact_email ? `<p class="meta">Contact: ${escapeHTML(biz.contact_email)}</p>` : ""}
          </div>
          <span class="status-pill status-${row.status}">${STATUS_LABELS[row.status] || row.status}</span>
        </div>
        <button type="button" class="btn-secondary review-toggle-preview" data-id="${row.id}" style="margin-top:12px;">
          ${expanded ? "Hide preview" : "Preview"}
        </button>
        ${expanded ? renderPreviewHTML(row, biz) : ""}
        <div class="review-card-actions">${actionsHTML}</div>
      </div>`;
  }

  // Renders the campaign the same way a student would actually see it --
  // reuses the exact .pf-*/.pm-* markup and CSS the live campaign-builder
  // preview (advertise-new-campaign.html) already uses, just populated
  // once from a saved row instead of updating live from form input. Lets
  // staff sanity-check the real rendered ad (crop, headline length,
  // whether a video's audio/backdrop look right) instead of judging raw
  // text fields alone.
  function renderPreviewHTML(row, biz) {
    const isFeedTier = row.tier === "feed_and_pin";
    const logo = biz?.cover_url
      ? `<img src="${biz.cover_url}" alt="" style="width:100%;height:100%;object-fit:cover;">`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M4 21V9l8-6 8 6v12M9 21v-6h6v6"/></svg>`;
    const bizName = biz ? escapeHTML(biz.name) : "Unknown business";

    let feedBlockHTML = "";
    if (isFeedTier) {
      let mediaHTML = "";
      if (row.media_url) {
        mediaHTML = row.media_type === "video"
          ? `<video class="pf-media-bg" src="${row.media_url}" autoplay muted loop playsinline></video>` +
            `<video class="pf-media-fg" src="${row.media_url}" autoplay muted loop playsinline></video>`
          : `<img src="${row.media_url}" alt="">`;
      }
      feedBlockHTML = `
        <div class="review-preview-col">
          <p class="preview-heading">Home feed preview</p>
          <div class="preview-frame">
            <div class="pf-header">
              <div class="pf-logo">${logo}</div>
              <div class="pf-names">
                <div class="pf-bizname">${bizName}</div>
                <div class="pf-sponsored">Sponsored</div>
              </div>
              <div class="pf-dots">&#8942;</div>
            </div>
            <div class="pf-media${mediaHTML ? " has-media" : ""}">${mediaHTML}</div>
            <div class="pf-body">
              <div class="pf-headline">${escapeHTML(row.headline)}</div>
              <div class="pf-desc">${row.body ? escapeHTML(row.body) : ""}</div>
              ${row.cta_label ? `<div class="pf-cta shown">${escapeHTML(row.cta_label)}</div>` : ""}
            </div>
          </div>
        </div>`;
    }

    return `
      <div class="review-preview">
        ${feedBlockHTML}
        <div class="review-preview-col">
          <p class="preview-heading">Find map preview</p>
          <div class="preview-frame">
            <div class="pm-pin-row">
              <div class="pm-pin-badge">
                <div class="pm-pin-circle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M4 21V9l8-6 8 6v12M9 21v-6h6v6"/></svg></div>
                <div class="pm-pin-ad-tag">AD</div>
              </div>
              <div class="pm-pin-name">${bizName}</div>
            </div>
            <div class="pm-detail">
              <div class="pm-detail-header">
                <div class="pm-detail-logo">${logo}</div>
                <div>
                  <div class="pm-detail-name">${bizName}</div>
                  <div class="pm-detail-sub">Sponsored</div>
                </div>
              </div>
              <div class="pm-detail-headline">${escapeHTML(row.headline)}</div>
              ${row.body ? `<div class="pm-detail-desc">${escapeHTML(row.body)}</div>` : ""}
            </div>
            <p class="pm-detail-caption">What a student sees when they tap the pin</p>
          </div>
        </div>
      </div>`;
  }

  // Delegated click handling -- the list is fully re-rendered via
  // innerHTML after every action, so per-button listeners would just be
  // thrown away each time; one listener on the container survives that.
  content.addEventListener("click", async (e) => {
    const approveBtn = e.target.closest(".review-approve");
    const rejectBtn = e.target.closest(".review-reject");
    const createOrderBtn = e.target.closest(".review-create-order");
    const markPaidBtn = e.target.closest(".review-mark-paid");
    const activateBtn = e.target.closest(".review-activate");
    const togglePreviewBtn = e.target.closest(".review-toggle-preview");
    const undoRejectBtn = e.target.closest(".review-undo-reject");
    const copyLinkBtn = e.target.closest(".review-copy-link");
    const filterTabBtn = e.target.closest(".review-filter-tab");

    if (approveBtn) {
      await handleApprove(approveBtn.dataset.id);
    } else if (rejectBtn) {
      await handleReject(rejectBtn.dataset.id);
    } else if (createOrderBtn) {
      await handleCreateOrder(createOrderBtn.dataset.id);
    } else if (markPaidBtn) {
      await handleMarkPaid(markPaidBtn.dataset.id);
    } else if (activateBtn) {
      await handleActivate(activateBtn.dataset.id);
    } else if (undoRejectBtn) {
      await handleUndoReject(undoRejectBtn.dataset.id);
    } else if (togglePreviewBtn) {
      // Pure UI state, no network round trip -- re-render from the
      // already-fetched `lastRows` cache.
      const id = togglePreviewBtn.dataset.id;
      if (expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
      render();
    } else if (filterTabBtn) {
      activeFilter = filterTabBtn.dataset.filter;
      render();
    } else if (copyLinkBtn) {
      try {
        await navigator.clipboard.writeText(copyLinkBtn.dataset.link);
        const original = copyLinkBtn.textContent;
        copyLinkBtn.textContent = "Copied!";
        setTimeout(() => { copyLinkBtn.textContent = original; }, 1500);
      } catch {
        alert("Couldn't copy automatically — select and copy the link text instead.");
      }
    }
  });

  async function handleApprove(id) {
    const { error } = await supabase
      .from("campaign_submissions")
      .update({ status: "approved", reviewed_at: new Date().toISOString() })
      .eq("id", id);
    if (error) { alert("Couldn't approve: " + error.message); return; }
    await loadAndRender();
  }

  async function handleReject(id) {
    const reason = window.prompt("Reason for rejecting this campaign (shown to the business):");
    if (reason === null) return; // canceled
    const { error } = await supabase
      .from("campaign_submissions")
      .update({ status: "rejected", rejection_reason: reason.trim() || null, reviewed_at: new Date().toISOString() })
      .eq("id", id);
    if (error) { alert("Couldn't reject: " + error.message); return; }
    await loadAndRender();
  }

  // Sends a rejected submission back to the front of the pending-review
  // queue -- for a misclick, or a business who's asked to reconsider.
  // Clears rejection_reason/reviewed_at along with the status flip so a
  // stale reason from the first rejection can't linger and confuse a
  // second review pass.
  async function handleUndoReject(id) {
    if (!window.confirm("Move this campaign back to Pending review?")) return;
    const { error } = await supabase
      .from("campaign_submissions")
      .update({ status: "pending_review", rejection_reason: null, reviewed_at: null })
      .eq("id", id);
    if (error) { alert("Couldn't undo rejection: " + error.message); return; }
    await loadAndRender();
  }

  async function handleCreateOrder(id) {
    const { data: row, error: fetchError } = await supabase
      .from("campaign_submissions")
      .select("*")
      .eq("id", id)
      .maybeSingle();
    if (fetchError || !row) { alert("Couldn't load this submission: " + (fetchError?.message || "not found")); return; }

    const { cents, hasUpcharge } = amountInfo(row);
    const dollars = (cents / 100).toFixed(0);
    if (!window.confirm(`Create a $${dollars} order for this campaign?${hasUpcharge ? " (includes $50 video upcharge)" : ""}`)) return;

    const endsAt = new Date(Date.now() + ORDER_DAYS * 24 * 60 * 60 * 1000).toISOString();

    const { data: order, error: orderError } = await supabase
      .from("ad_orders")
      .insert({ business_id: row.business_id, tier: row.tier, amount_cents: cents, ends_at: endsAt })
      .select()
      .single();
    if (orderError) { alert("Couldn't create order: " + orderError.message); return; }

    const { error: linkError } = await supabase
      .from("campaign_submissions")
      .update({ order_id: order.id })
      .eq("id", id);
    if (linkError) { alert("Order created, but couldn't link it to the submission: " + linkError.message); return; }

    // Best-effort: the order already exists and is linked either way, so a
    // failed send here shouldn't look like the whole action failed -- just
    // surface it so staff know to send the link manually (it's still shown
    // + copyable on the card either way, same as before this existed).
    const { error: emailError } = await supabase.functions.invoke("send-order-payment-email", {
      body: { orderId: order.id },
    });
    if (emailError) {
      alert("Order created, but the payment email couldn't be sent (" + emailError.message + "). You can still copy the link below and send it yourself.");
    }

    await loadAndRender();
  }

  async function handleMarkPaid(id) {
    const { data: row, error: fetchError } = await supabase
      .from("campaign_submissions")
      .select("*, order:ad_orders(*)")
      .eq("id", id)
      .maybeSingle();
    if (fetchError || !row || !row.order) { alert("Couldn't load this submission's order."); return; }

    const stripeRef = window.prompt("Stripe payment/session ID (optional, for your records):", "") || null;
    if (!window.confirm("Mark this order as paid?")) return;

    const { error: orderError } = await supabase
      .from("ad_orders")
      .update({ payment_status: "paid", paid_at: new Date().toISOString(), stripe_reference: stripeRef })
      .eq("id", row.order.id);
    if (orderError) { alert("Couldn't mark order paid: " + orderError.message); return; }

    const { error: statusError } = await supabase
      .from("campaign_submissions")
      .update({ status: "paid" })
      .eq("id", id);
    if (statusError) { alert("Order marked paid, but couldn't update the submission status: " + statusError.message); return; }

    await loadAndRender();
  }

  async function handleActivate(id) {
    const { data: row, error: fetchError } = await supabase
      .from("campaign_submissions")
      .select("*, order:ad_orders(*)")
      .eq("id", id)
      .maybeSingle();
    if (fetchError || !row || !row.order) { alert("Couldn't load this submission's order."); return; }

    if (!window.confirm("Activate this campaign now? This creates the live ad" + (row.tier === "feed_and_pin" ? " + feed post" : "") + " and map pin.")) return;

    const nowISO = new Date().toISOString();

    // Map Pin tier and Feed + Map Pin tier both always include a pin --
    // it renders at the business's own stored location (businesses.location),
    // it has no location of its own. If `promotion_address` was filled in
    // on the submission, this pin will still show at the business's usual
    // address until that's geocoded separately (see the note already
    // shown above this button) -- not automated here.
    const { error: pinError } = await supabase
      .from("sponsored_pins")
      .insert({
        business_id: row.business_id,
        deal_headline: row.headline,
        deal_description: row.body,
        starts_at: nowISO,
        ends_at: row.order.ends_at,
        is_active: true,
        order_id: row.order.id,
      });
    if (pinError) { alert("Couldn't create the map pin: " + pinError.message); return; }

    if (row.tier === "feed_and_pin") {
      const { error: campaignError } = await supabase
        .from("ad_campaigns")
        .insert({
          business_id: row.business_id,
          headline: row.headline,
          body: row.body,
          media_url: row.media_url,
          media_type: row.media_type,
          cta_label: row.cta_label,
          cta_url: row.cta_url,
          starts_at: nowISO,
          ends_at: row.order.ends_at,
          is_active: true,
          order_id: row.order.id,
        });
      if (campaignError) { alert("Pin created, but couldn't create the feed post: " + campaignError.message); return; }
    }

    const { error: statusError } = await supabase
      .from("campaign_submissions")
      .update({ status: "live" })
      .eq("id", id);
    if (statusError) { alert("Campaign is live, but couldn't update the submission status: " + statusError.message); return; }

    await loadAndRender();
  }

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</html>
