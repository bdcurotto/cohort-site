<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opening Cohort…</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --text:#000000; --text-secondary:#55555A; --accent:#5985E8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --text:#F2F2F5; --text-secondary:#A6A6AD; --accent:#759EF7; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); text-align: center; padding: 24px;
  }
  .box { max-width: 360px; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 20px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
    border-top-color: var(--accent); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: var(--text-secondary); margin: 0 0 20px; }
  a.btn {
    display: inline-block; font-size: 14px; font-weight: 700; color: #fff;
    background: var(--accent); padding: 12px 22px; border-radius: 100px; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Opening Cohort…</h1>
    <p>If the app doesn't open automatically, tap the button below.</p>
    <a class="btn" id="open-app" href="#">Open Cohort</a>
  </div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  // The Supabase "Reset Password" email template hardcodes its link
  // straight to THIS page (?token_hash=...&type=recovery) rather than
  // using the dynamic {{ .RedirectTo }} variable -- built that way
  // originally so a raw `cohort://` link never has to sit directly in an
  // email body (some clients/scanners mangle non-http(s) links). That
  // means every reset email, whether requested from the app or from the
  // website's business advertiser portal, lands here first with no way to
  // tell them apart from the URL alone.
  //
  // Fix: verify the recovery token right here, then check whether the
  // resulting session belongs to a `businesses` row. If it does, this is
  // a business account -- send it to the website's own reset page instead
  // of trying to open the native app (businesses have no account presence
  // in the app at all, by design). Anyone else falls through to the
  // original app-opening behavior, unchanged.
  const SUPABASE_URL = "https://mslfhrtaybiiclwhrstr.supabase.co";
  const SUPABASE_ANON_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zbGZocnRheWJpaWNsd2hyc3RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMDk5NzUsImV4cCI6MjA5OTg4NTk3NX0.G__EouXFF6fW9bK4BYLTPi6o6utVesZQqCPXFCQ5NiE";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true },
  });

  function openApp() {
    var appURL = "cohort://auth-callback" + window.location.search;
    document.getElementById("open-app").href = appURL;
    window.location.replace(appURL);
  }

  const params = new URLSearchParams(window.location.search);
  const tokenHash = params.get("token_hash");
  const type = params.get("type");

  if (!tokenHash || type !== "recovery") {
    // Not a recovery link this page knows how to inspect -- behave exactly
    // as before.
    openApp();
  } else {
    const { data, error } = await supabase.auth.verifyOtp({ token_hash: tokenHash, type: "recovery" });
    if (error || !data.session) {
      // Invalid/expired token -- let the app's own error handling show
      // that, same as always.
      openApp();
    } else {
      const { data: business } = await supabase
        .from("businesses")
        .select("id")
        .eq("auth_user_id", data.session.user.id)
        .maybeSingle();
      if (business) {
        // Session is already established (verifyOtp above) -- the next
        // page just needs to know not to try consuming token_hash again,
        // since it's single-use and already spent.
        window.location.replace("advertise-reset-password.html?verified=1");
      } else {
        openApp();
      }
    }
  }
</script>
</body>
</html>
